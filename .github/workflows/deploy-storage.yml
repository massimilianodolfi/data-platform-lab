name: Deploy MinIO Storage

run-name: Deploy MinIO storage requested by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-platform-lab-storage
  cancel-in-progress: false

jobs:
  deploy-storage:
    name: Create and start MinIO
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${MINIO_ROOT_USER}" ]]; then
            echo "::error::Repository secret MINIO_ROOT_USER is not configured."
            exit 1
          fi

          if [[ -z "${MINIO_ROOT_PASSWORD}" ]]; then
            echo "::error::Repository secret MINIO_ROOT_PASSWORD is not configured."
            exit 1
          fi

          if [[ ${#MINIO_ROOT_PASSWORD} -lt 8 ]]; then
            echo "::error::MINIO_ROOT_PASSWORD must contain at least 8 characters."
            exit 1
          fi

      - name: Create storage configuration directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage

      - name: Create MinIO Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > storage/docker-compose.yml <<'YAML'
          services:
            minio:
              image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
              container_name: minio
              hostname: minio

              command:
                - server
                - /data
                - --console-address
                - ":9001"

              environment:
                MINIO_ROOT_USER: ${MINIO_ROOT_USER}
                MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
                TZ: Europe/Amsterdam

              ports:
                # S3 API: available to the Mac and kind pods.
                - "9000:9000"

                # Administrative console: Mac access only.
                - "127.0.0.1:9001:9001"

              volumes:
                - minio-data:/data

              restart: unless-stopped

          volumes:
            minio-data:
              name: data-platform-minio-data
          YAML

      - name: Create runtime environment file
        shell: bash
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          {
            printf 'MINIO_ROOT_USER=%s\n' "$MINIO_ROOT_USER"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$MINIO_ROOT_PASSWORD"
          } > storage/.env

      - name: Start MinIO
        shell: bash
        working-directory: storage
        run: |
          set -euo pipefail

          docker compose \
            --env-file .env \
            up -d \
            --force-recreate \
            --remove-orphans

          docker compose ps

      - name: Wait for MinIO health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:9000/minio/health/ready \
              >/dev/null
            then
              echo "MinIO is ready."
              exit 0
            fi

            echo "Attempt ${attempt}: waiting for MinIO..."
            sleep 2
          done

          echo "::error::MinIO did not become ready."
          docker ps -a --filter name=minio
          docker logs --tail 100 minio || true
          exit 1

      - name: Create MinIO buckets
        shell: bash
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          for bucket in \
            raw \
            processed \
            checkpoints \
            spark-events
          do
            echo "Checking bucket: ${bucket}"

            if docker run --rm \
              -e AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
              -e AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
              -e AWS_DEFAULT_REGION="us-east-1" \
              amazon/aws-cli:2.38.3 \
              --endpoint-url http://host.docker.internal:9000 \
              s3api head-bucket \
              --bucket "$bucket" \
              >/dev/null 2>&1
            then
              echo "Bucket already exists: ${bucket}"
            else
              echo "Creating bucket: ${bucket}"

              docker run --rm \
                -e AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
                -e AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
                -e AWS_DEFAULT_REGION="us-east-1" \
                amazon/aws-cli:2.38.3 \
                --endpoint-url http://host.docker.internal:9000 \
                s3api create-bucket \
                --bucket "$bucket"
            fi
          done

      - name: List MinIO buckets
        shell: bash
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
            -e AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
            -e AWS_DEFAULT_REGION="us-east-1" \
            amazon/aws-cli:2.38.3 \
            --endpoint-url http://host.docker.internal:9000 \
            s3api list-buckets

      - name: Verify MinIO API from Mac
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:9000/minio/health/ready \
            >/dev/null

          echo "MinIO API is ready on http://127.0.0.1:9000"
          echo "MinIO Console is ready on http://127.0.0.1:9001"
          echo "Spark endpoint is http://host.docker.internal:9000"

      - name: Verify MinIO API from Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          if ! kubectl get namespace spark >/dev/null 2>&1; then
            echo "Spark namespace does not exist."
            echo "Skipping the Kubernetes connectivity test."
            exit 0
          fi

          TEST_POD="minio-storage-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            kubectl delete pod \
              -n spark \
              "$TEST_POD" \
              --ignore-not-found=true \
              --wait=false \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          kubectl run "$TEST_POD" \
            -n spark \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --command -- \
            curl \
              --fail \
              --silent \
              --show-error \
              http://host.docker.internal:9000/minio/health/ready

          for attempt in $(seq 1 60); do
            phase=$(kubectl get pod \
              -n spark \
              "$TEST_POD" \
              -o jsonpath='{.status.phase}' \
              2>/dev/null || true)

            case "$phase" in
              Succeeded)
                echo "Kubernetes pods can reach MinIO."
                kubectl logs -n spark "$TEST_POD" || true
                exit 0
                ;;

              Failed)
                kubectl describe pod -n spark "$TEST_POD" || true
                kubectl logs -n spark "$TEST_POD" || true
                exit 1
                ;;

              *)
                echo "Attempt ${attempt}: pod phase=${phase:-Pending}"
                sleep 2
                ;;
            esac
          done

          echo "::error::Timed out checking MinIO from Kubernetes."
          kubectl describe pod -n spark "$TEST_POD" || true
          exit 1

      - name: Verify persistent Docker volume
        shell: bash
        run: |
          set -euo pipefail

          docker volume inspect data-platform-minio-data

          docker inspect minio \
            --format '{{range .Mounts}}{{println .Type .Name .Destination}}{{end}}'

      - name: Remove runtime credentials file
        if: always()
        shell: bash
        run: |
          rm -f storage/.env

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MinIO storage deployment'
            echo
            echo '- Container: `minio`'
            echo '- API from Mac: `http://127.0.0.1:9000`'
            echo '- API from Spark: `http://host.docker.internal:9000`'
            echo '- Console from Mac: `http://127.0.0.1:9001`'
            echo '- Persistent volume: `data-platform-minio-data`'
            echo '- Buckets: `raw`, `processed`, `checkpoints`, `spark-events`'
            echo
            echo 'The temporary `.env` file was removed after deployment.'
          } >> "$GITHUB_STEP_SUMMARY"